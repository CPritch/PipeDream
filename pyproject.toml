[project]
name = "pipedream-fiction"
version = "0.3.1"
description = "Real-time generative visualization for interactive fiction."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Pxld Ltd.", email = "charlespritchard.work@gmail.com" }
]
dependencies = [
    "pexpect>=4.9.0",
    "platformdirs>=4.3.0",
    "pyside6>=6.10.1",
    "requests>=2.32.5",
]

[project.urls]
Homepage = "https://github.com/CPritch/PipeDream"
Issues = "https://github.com/CPritch/PipeDream/issues"

[project.scripts]
pipedream = "pipedream.engine:main"
pipedream-gui = "pipedream.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipedream"]
